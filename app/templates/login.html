<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Autonomous YouTube Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #161925;
      --border: #262b3a;
      --text: #e6e8ef;
      --muted: #8b90a3;
      --accent: #5b8cff;
      --green: #3ecf8e;
      --red: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .logo p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
    }
    button {
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.7rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    .error {
      margin-top: 1rem;
      padding: 0.6rem 0.85rem;
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid var(--red);
      border-radius: 7px;
      color: var(--red);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🎬 Autonomous YouTube Studio</h1>
      <p>Enter your dashboard access token</p>
    </div>
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="token">Access Token</label>
        <input type="password" id="token" name="token" placeholder="••••••••••••" autofocus required>
      </div>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
