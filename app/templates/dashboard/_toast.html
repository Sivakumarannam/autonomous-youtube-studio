<div id="notif-toast"
     style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;
            padding:0.75rem 1.2rem;border-radius:8px;font-size:0.88rem;
            max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.4);
            background:{% if error %}#2a0a0a{% else %}#0a2a15{% endif %};
            border:1px solid {% if error %}#8b1a1a{% else %}#1a6b3a{% endif %};
            color:{% if error %}#f87171{% else %}#4ade80{% endif %}"
     _="on load wait 4s then remove me">
  {{ message }}
</div>
