[pytest]
# ──────────────────────────────────────────────────────────────────────────────
# Autonomous YouTube Studio — pytest configuration
# ──────────────────────────────────────────────────────────────────────────────

asyncio_mode = auto

testpaths =
    tests

python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (no external services)
    integration: Integration tests (requires database)
    e2e: End-to-end tests (full stack)
    slow: Tests that take more than 2 seconds
    agent: Agent-specific tests
    api: API endpoint tests

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    --color=yes
    --durations=10

# Logging
log_cli          = true
log_cli_level    = WARNING
log_cli_format   = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Disable asyncio deprecation warnings from libraries
filterwarnings =
    ignore::DeprecationWarning:aiosqlite
    ignore::DeprecationWarning:sqlalchemy
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:asyncio

# Environment variables for tests — override application settings
env =
    APP_ENV=testing
    LLM_PROVIDER=mock
    DATABASE_URL=sqlite+aiosqlite:///:memory:
    DATABASE_SYNC_URL=sqlite:///:memory:
    REDIS_URL=redis://localhost:6379/15
    AUTO_GENERATE=true
    AUTO_UPLOAD=false
    LOG_LEVEL=WARNING
    STORAGE_LOCAL_PATH=./storage